name: Log Rotation Tests
on:
  push:
    branches: [training/daily-log-rotation]
  pull_request:
    paths:
      - 'tools/render_log_sync.py'
      - 'tools/test_render_log_sync.py'
      - '.github/workflows/log-rotation-tests.yml'
jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -p test_render_log_sync.py -v
