name: IBS validation
on:
  push:
    branches: [training/log-analysis-enhancements]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B verify
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          for name in ('index.html','logs.html','monitor.html'):
              p = pathlib.Path('src/main/resources/static') / name
              for script in re.findall(r'<script\b[^>]*>(.*?)</script>', p.read_text(), re.S):
                  with tempfile.NamedTemporaryFile(suffix='.js', mode='w') as f:
                      f.write(script)
                      f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
          PY
      - run: python3 -m py_compile tools/render_log_sync.py
      - name: Functional HTTP smoke tests
        env:
          IBS_SUPPORT_KEY: ci-only-test-key
          PORT: '8080'
        run: |
          java -jar target/banking-1.0.0.jar > /tmp/ibs-ci.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -n 80 /tmp/ibs-ci.log' EXIT
          python3 tools/ibs_smoke_test.py
