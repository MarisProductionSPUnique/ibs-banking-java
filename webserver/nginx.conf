log_format ibs escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstreamStatus":"$upstream_status","durationSec":$request_time,"upstreamSec":"$upstream_response_time"}';
server {
 listen 8080;
 server_name _;
 access_log /dev/stdout ibs;
 error_log /dev/stderr warn;
 location = /web-health { default_type text/plain; add_header X-Request-ID $request_id always; return 200 "UP\n"; }
 location / {
 proxy_pass https://ibs-banking-appserver.onrender.com;
 proxy_ssl_server_name on;
 proxy_set_header Host ibs-banking-appserver.onrender.com;
 proxy_set_header X-Request-ID $request_id;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto https;
 proxy_hide_header X-Request-ID;
 add_header X-Request-ID $request_id always;
 proxy_connect_timeout 15s;
 proxy_read_timeout 90s;
 }
}
