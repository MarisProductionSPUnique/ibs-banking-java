<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBS Support Login</title><style>body{font:16px system-ui;background:#edf3fa;color:#17314e;max-width:500px;margin:40px auto;padding:20px}input,button{font:inherit;padding:12px;margin:8px 0;max-width:90%}button{background:#1559a2;color:white;border:0;border-radius:6px}</style><h1>Production Support Login</h1><form id="form"><label>Support key<br><input id="key" type="password" required autocomplete="off"></label><br><button>Validate Support Key</button></form><p id="msg" role="status"></p><a href="/">Back to banking login</a><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('key'),msg=document.getElementById('msg');msg.textContent='Validating...';try{const r=await fetch('/api/support/login',{method:'POST',headers:{'X-Support-Key':key.value},cache:'no-store'});if(r.ok){key.value='';location.replace('/support-dashboard')}else msg.textContent='Validation failed: HTTP '+r.status}catch(e){msg.textContent='Connection failed; retry'}};</script></html>
