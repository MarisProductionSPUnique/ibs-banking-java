<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBS Banking</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f0f4f9;color:#172b46}header{background:#12345a;color:white;padding:24px}main{max-width:960px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}section{background:white;padding:20px;border-radius:12px;margin-bottom:16px}button{background:#1559a2;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd}small{color:#52647b}</style></head><body><header><h1>IBS Banking</h1>Integrated Banking System | Training environment</header><main><section><h2>Customer dashboard</h2><p>Demo accounts only. No real banking transactions.</p><button id="refresh">Refresh dashboard</button><p id="health" role="status">Checking application...</p></section><h2>Accounts</h2><div class="cards" id="accounts"></div><section><h2>Transaction history</h2><table><thead><tr><th>Reference</th><th>Amount</th><th>Status</th></tr></thead><tbody id="transactions"></tbody></table></section><small>Oracle integration deferred | IBS production support lab</small></main><script>const el=id=>document.getElementById(id);function node(tag,value){const n=document.createElement(tag);n.textContent=value;return n}async function get(path){const r=await fetch('/api/'+path);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function load(){try{const [h,a,t]=await Promise.all(['health','accounts','transactions'].map(get));el('health').textContent='Application: '+h.status+' | Database: '+h.database;el('accounts').replaceChildren(...a.map(x=>{const s=node('section','');s.append(node('h3',x.account),node('p',new Intl.NumberFormat('en-IN',{style:'currency',currency:x.currency}).format(x.balance)));return s}));el('transactions').replaceChildren(...t.map(x=>{const r=node('tr','');r.append(node('td',x.reference),node('td',x.amount),node('td',x.status));return r}));}catch(e){el('health').textContent='Unable to load dashboard: '+e.message}}el('refresh').addEventListener('click',load);load();</script></body></html>
