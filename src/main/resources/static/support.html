<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBS Support Console</title><style>body{font:16px system-ui;margin:0;background:#edf3fa;color:#17314e}header{background:#12345a;color:white;padding:24px}main{max-width:900px;margin:auto;padding:16px}section{background:white;padding:20px;border-radius:12px;margin:14px 0}button{background:#1559a2;color:white;padding:12px;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#1559a2}</style></head><body><header><h1>IBS Support Console</h1>Production support training</header><main><section><h2>Service health checks</h2><button id="run">Run health checks</button><div id="results" role="status"></div></section><section><h2>Diagnostic history</h2><p>Browser-generated probe results, not server logs.</p><button id="clear">Clear history</button><pre id="history"></pre></section><section><h2>Server logs</h2><p>Authorized trainers can view actual logs in Render.</p><p><a href="https://dashboard.render.com/web/srv-dc34qq7avr4c73eaf4t0">Nginx dashboard</a></p><p><a href="https://dashboard.render.com/web/srv-dc34o4vavr4c73ea6o80">Java dashboard</a></p><a href="/">Return to banking</a></section></main><script>const el=x=>document.getElementById(x);let history=[];async function probe(name,path){let start=performance.now();try{let r=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(20000)});let body=await r.text();return {name,status:r.status,ms:Math.round(performance.now()-start),id:r.headers.get('X-Request-ID')||'Unavailable',body:body.slice(0,200)}}catch(e){return {name,status:'ERROR',ms:Math.round(performance.now()-start),id:'Unavailable',body:e.message}}}async function run(){el('run').disabled=true;el('results').textContent='Checking...';let results=await Promise.all([probe('Nginx','/web-health'),probe('Java API','/api/health'),probe('Spring Boot','/actuator/health')]);el('results').replaceChildren(...results.map(r=>{let p=document.createElement('pre');p.textContent=r.name+' | HTTP '+r.status+' | '+r.ms+' ms\nRequest ID: '+r.id+'\n'+r.body;return p}));history.unshift(...results.map(r=>new Date().toISOString()+' '+r.name+' HTTP '+r.status+' '+r.ms+'ms requestId='+r.id));history=history.slice(0,100);el('history').textContent=history.join('\n');el('run').disabled=false}el('run').onclick=run;el('clear').onclick=()=>{history=[];el('history').textContent=''};</script></body></html>
