<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBS Incident Simulator</title><style>body{font:16px system-ui;background:#edf3fa;color:#17314e;max-width:800px;margin:20px auto;padding:16px}section{background:white;padding:16px;border-radius:12px;margin:16px 0}button,input{font:inherit;padding:12px;margin:5px;max-width:90%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142438;color:white;padding:16px}</style><h1>IBS Incident Simulator</h1><p>Controlled training responses only. No actual outage or database change.</p><section><label>Support key <input id="key" type="password" autocomplete="off"></label></section><section><h2>HTTP and Java scenarios</h2><div id="buttons"></div></section><section><h2>Incident result</h2><pre id="out" role="status">Select a scenario.</pre><a href="/logs.html">Investigate logs</a> · <a href="/support.html">Health checks</a></section><script>const scenarios={'400':'Bad Request','401':'Unauthorized','403':'Forbidden','404':'Not Found','500':'Internal Error','502':'Bad Gateway','503':'Unavailable','504':'Gateway Timeout','NPE':'NullPointerException','SQL':'SQLException','TIMEOUT':'SocketTimeoutException'};const out=document.getElementById('out'),buttons=document.getElementById('buttons');let busy=false;for(const [id,name] of Object.entries(scenarios)){const b=document.createElement('button');b.textContent=id+' – '+name;b.onclick=async()=>{if(busy)return;const key=document.getElementById('key').value;if(!key){out.textContent='Enter support key';return}busy=true;out.textContent='Running scenario…';try{const r=await fetch('/api/training/incident/'+id,{method:'POST',headers:{'X-Support-Key':key},cache:'no-store'});const body=await r.json();out.textContent=body.simulation?JSON.stringify(body,null,2):'Scenario not confirmed. HTTP '+r.status;}catch(e){out.textContent='Request failed: '+e.message}finally{busy=false}};buttons.appendChild(b)}</script></html>
