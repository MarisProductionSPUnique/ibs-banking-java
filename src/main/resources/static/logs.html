<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBS Log Analysis</title><style>body{font:16px system-ui;background:#edf3fa;color:#17314e;margin:20px}input,select,button{padding:10px;margin:5px;max-width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142438;color:#e0f2fe;padding:15px}button{cursor:pointer}</style><h1>IBS Log Analysis</h1><p>Actual Java request events, latest 500 per instance. Not raw Nginx or exception logs.</p><label>Support key <input id="key" type="password" autocomplete="off"></label><br><input id="q" placeholder="Request ID or keyword"><select id="level"><option value="">All levels</option><option>INFO</option><option>WARN</option><option>ERROR</option></select><input id="status" placeholder="HTTP status"><br><button id="search">Search / Refresh</button><button id="export">Export JSON</button><p id="message" role="status"></p><pre id="out"></pre><a href="/support.html">Support console</a><script>const el=x=>document.getElementById(x);let rows=[];async function search(){rows=[];el('out').textContent='';try{const p=new URLSearchParams({q:el('q').value,level:el('level').value,status:el('status').value});const r=await fetch('/api/support/logs?'+p,{headers:{'X-Support-Key':el('key').value},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);rows=await r.json();el('message').textContent=rows.length+' events';el('out').textContent=rows.map(x=>JSON.stringify(x)).join('\n')}catch(e){el('message').textContent=e.message}}el('search').onclick=search;el('export').onclick=()=>{if(!rows.length)return;const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='ibs-request-logs.json';a.click();URL.revokeObjectURL(u)};</script></html>
