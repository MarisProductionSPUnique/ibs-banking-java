spring.application.name=ibs-banking
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
server.tomcat.accesslog.enabled=true
server.tomcat.basedir=/tmp/ibs-tomcat
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss,UTC} %-5level %logger{36} requestId=%X{requestId:-none} - %msg%n
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m

# Bounded local application logs; Render console remains enabled.
logging.file.name=/tmp/ibs-logs/application.log
logging.logback.rollingpolicy.file-name-pattern=/tmp/ibs-logs/application.%d{yyyy-MM-dd,UTC}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=12MB
server.tomcat.accesslog.max-days=3
server.tomcat.accesslog.pattern=%t %m %s %D %{X-Request-ID}o
